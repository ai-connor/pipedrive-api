    addDealProductRequest:
      allOf:
      - properties:
          product_id:
            description: The ID of the product
            type: integer
          item_price:
            description: The price value of the product
            type: number
          quantity:
            description: The quantity of the product
            type: number
          tax:
            default: 0
            description: The product tax
            type: number
          comments:
            description: The comments of the product
            type: string
          discount:
            default: 0
            description: The value of the discount. The `discount_type` field can
              be used to specify whether the value is an amount or a percentage
            type: number
          is_enabled:
            default: true
            description: |
              Whether this product is enabled for the deal

              Not possible to disable the product if the deal has installments associated and the product is the last one enabled

              Not possible to enable the product if the deal has installments associated and the product is recurring
            type: boolean
          tax_method:
            description: "The tax option to be applied to the products. When using\
              \ `inclusive`, the tax percentage will already be included in the price.\
              \ When using `exclusive`, the tax will not be included in the price.\
              \ When using `none`, no tax will be added. Use the `tax` field for defining\
              \ the tax percentage amount. By default, the user setting value for\
              \ tax options will be used. Changing this in one product affects the\
              \ rest of the products attached to the deal"
            enum:
            - exclusive
            - inclusive
            - none
            type: string
          discount_type:
            default: percentage
            description: The value of the discount. The `discount_type` field can
              be used to specify whether the value is an amount or a percentage
            enum:
            - percentage
            - amount
            type: string
          product_variation_id:
            description: The ID of the product variation
            nullable: true
            type: integer
        required:
        - item_price
        - product_id
        - quantity
        title: dealProductRequestBody
        type: object
      - properties:
          billing_frequency:
            default: one-time
            description: |
              Only available in Growth and above plans

              How often a customer is billed for access to a service or product

              To set `billing_frequency` different than `one-time`, the deal must not have installments associated

              A deal can have up to 20 products attached with `billing_frequency` different than `one-time`
            enum:
            - one-time
            - annually
            - semi-annually
            - quarterly
            - monthly
            - weekly
            type: string
        type: object
      - properties:
          billing_frequency_cycles:
            description: |
              Only available in Growth and above plans

              The number of times the billing frequency repeats for a product in a deal

              When `billing_frequency` is set to `one-time`, this field must be `null`

              When `billing_frequency` is set to `weekly`, this field cannot be `null`

              For all the other values of `billing_frequency`, `null` represents a product billed indefinitely

              Must be a positive integer less or equal to 208
            nullable: true
            type: integer
        type: object
      - properties:
          billing_start_date:
            description: |
              Only available in Growth and above plans

              The billing start date. Must be between 10 years in the past and 10 years in the future
            format: date
            nullable: true
            type: string
        type: object
      required:
      - item_price
      - product_id
      - quantity
      title: addDealProductRequest
