        explode: true
        in: query
        name: limit
        required: false
        schema:
          example: 100
          type: integer
        style: form
      - description: "For pagination, the marker (an opaque string value) representing\
          \ the first item on the next page"
        explode: true
        in: query
        name: cursor
        required: false
