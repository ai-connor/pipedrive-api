        explode: true
        in: query
        name: ids
        required: false
        schema:
          type: string
        style: form
      - description: "If supplied, only deals owned by the specified user are returned.\
          \ If filter_id is provided, this is ignored."
        explode: true
        in: query
        name: owner_id
        required: false
        schema:
          type: integer
        style: form
      - description: "If supplied, only deals linked to the specified person are returned.\
          \ If filter_id is provided, this is ignored."
        explode: true
        in: query
        name: person_id
        required: false
        schema:
          type: integer
        style: form
      - description: "If supplied, only deals linked to the specified organization\
          \ are returned. If filter_id is provided, this is ignored."
        explode: true
        in: query
        name: org_id
        required: false
        schema:
          type: integer
        style: form
      - description: "If supplied, only deals in the specified pipeline are returned.\
          \ If filter_id is provided, this is ignored."
        explode: true
        in: query
        name: pipeline_id
        required: false
        schema:
          type: integer
        style: form
      - description: "If supplied, only deals in the specified stage are returned.\
          \ If filter_id is provided, this is ignored."
        explode: true
        in: query
        name: stage_id
        required: false
        schema:
          type: integer
        style: form
      - description: "Only fetch deals with a specific status. If omitted, all not\
          \ deleted deals are returned. If set to deleted, deals that have been deleted\
          \ up to 30 days ago will be included. Multiple statuses can be included\
          \ as a comma separated array. If filter_id is provided, this is ignored."
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - open
          - won
          - lost
          - deleted
          type: string
        style: form
      - description: "If set, only deals with an `update_time` later than or equal\
          \ to this time are returned. In RFC3339 format, e.g. 2025-01-01T10:20:00Z."
        explode: true
        in: query
        name: updated_since
        required: false
        schema:
          type: string
        style: form
      - description: "If set, only deals with an `update_time` earlier than this time\
          \ are returned. In RFC3339 format, e.g. 2025-01-01T10:20:00Z."
        explode: true
        in: query
        name: updated_until
        required: false
        schema:
