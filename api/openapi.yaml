        \ can either be the distinct values of the field (useful for searching autocomplete\
        \ field values), or the IDs of actual items (deals, leads, persons, organizations\
        \ or products)."
      operationId: searchItemByField
      parameters:
      - description: The search term to look for. Minimum 2 characters (or 1 if `match`
          is `exact`). Please note that the search term has to be URL encoded.
        explode: true
        in: query
        name: term
        required: true
        schema:
          type: string
        style: form
      - description: The type of the field to perform the search from
        explode: true
        in: query
        name: entity_type
        required: true
        schema:
          enum:
          - deal
          - lead
          - person
          - organization
          - product
          - project
          type: string
        style: form
      - description: "The type of match used against the term. The search <b>is</b>\
          \ case sensitive.<br/><br/> E.g. in case of searching for a value `monkey`,\
          \ <ul> <li>with `exact` match, you will only find it if term is `monkey`</li>\
          \ <li>with `beginning` match, you will only find it if the term matches\
          \ the beginning or the whole string, e.g. `monk` and `monkey`</li> <li>with\
          \ `middle` match, you will find the it if the term matches any substring\
          \ of the value, e.g. `onk` and `ke`</li> </ul>."
        explode: true
        in: query
        name: match
        required: false
        schema:
          default: exact
          enum:
          - exact
          - beginning
          - middle
          type: string
        style: form
      - description: "The key of the field to search from. The field key can be obtained\
          \ by fetching the list of the fields using any of the fields' API GET methods\
          \ (dealFields, personFields, etc.). Only the following custom field types\
          \ are searchable: `address`, `varchar`, `text`, `varchar_auto`, `double`,\
          \ `monetary` and `phone`. Read more about searching by custom fields <a\
          \ href=\"https://support.pipedrive.com/en/article/search-finding-what-you-need#searching-by-custom-fields\"\
          \ target=\"_blank\" rel=\"noopener noreferrer\">here</a>."
        explode: true
        in: query
        name: field
        required: true
        schema:
          type: string
        style: form
      - description: "For pagination, the limit of entries to be returned. If not\
          \ provided, 100 items will be returned. Please note that a maximum value\
          \ of 500 is allowed."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          example: 100
          type: integer
        style: form
      - description: "For pagination, the marker (an opaque string value) representing\
          \ the first item on the next page"
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                - id: 1
                  name: Jane Doe
                - id: 2
                  name: John Doe
                additional_data:
                  next_cursor: eyJmaWVsZCI6ImlkIiwiZmllbGRWYWx1ZSI6Nywic29ydERpcmVjdGlvbiI6ImFzYyIsImlkIjo3fQ
              schema:
                $ref: "#/components/schemas/GetItemSearchFieldResponse"
          description: Success
      security:
      - api_key: []
      - oauth2:
        - search:read
      summary: Perform a search using a specific field from an item type
      tags:
      - ItemSearch
      x-token-cost: 20
